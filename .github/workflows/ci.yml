name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project HIITTimer.xcodeproj \
            -scheme HIITTimer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Select an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available \
            | grep -m1 -E '^[[:space:]]+iPhone' \
            | sed -E 's/^[[:space:]]+(iPhone[^(]+)\(.*/\1/' \
            | sed -E 's/[[:space:]]+$//')
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project HIITTimer.xcodeproj \
            -scheme HIITTimer \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO
